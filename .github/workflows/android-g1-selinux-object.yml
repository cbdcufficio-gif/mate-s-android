name: Carrera G1 experimental SELinux object
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: carrera-g1-contracts
  cancel-in-progress: false
jobs:
  object:
    if: github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install public fixture and kernel build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc g++ make bc bison flex libncurses5-dev libssl-dev e2fsprogs android-sdk-libsparse-utils patchelf gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu
      - name: Verify all public fixtures and compile SELinux object only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c SHA256SUMS
          python3 scripts/run_complete_tests.py
          python3 scripts/g1_selinux_compile_probe.py
