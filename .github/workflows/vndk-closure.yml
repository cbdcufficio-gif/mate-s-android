name: Mate S VNDK static dependency audit
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/vndk_closure_probe.py
      - .github/workflows/vndk-closure.yml
permissions:
  contents: read
jobs:
  audit:
    if: github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 scripts/vndk_closure_probe.py
