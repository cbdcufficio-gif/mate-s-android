name: Mate S public Carrera system and ramdisk
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: mates-carrera-public-system
  cancel-in-progress: false
jobs:
  graph:
    if: github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      MATES_USE_CCACHE: '1'
      CCACHE_EXEC: /usr/bin/ccache
      CC_WRAPPER: /usr/bin/ccache
      CXX_WRAPPER: /usr/bin/ccache
      CCACHE_DIR: ${{ github.workspace }}/out/ccache
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPRESS: 'true'
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Prepare disposable runner for public Android sources
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          # Explicit allowlist of unused preinstalled SDKs on this disposable runner.
          # Keep Python/Node runtimes, Android source Git metadata and all build outputs.
          # Q Soong uses its prebuilts/jdk, not /usr/lib/jvm.
          test -z "${OVERRIDE_ANDROID_JAVA_HOME:-}"
          df -B1 .
          for path in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/.ghcup /opt/az /usr/local/share/chromium /opt/hostedtoolcache/Go /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk /opt/hostedtoolcache/go /usr/lib/jvm /usr/local/lib/node_modules /opt/google/chrome /opt/microsoft/msedge; do
            if [ -e "$path" ]; then
              sudo du -sx -B1 -- "$path"
              sudo rm -rf -- "$path"
            fi
          done
          df -B1 .
          command -v python3 git
          # This job builds on the host; no Docker image is needed.
          if command -v docker >/dev/null && sudo docker info >/dev/null 2>&1; then
            sudo docker system df
            sudo docker image prune --all --force
            sudo docker system df
          fi
          df -B1 .
          # These nine unused host tools were measured and reclaimed by probe40599220835.
          # Preserve runner Python/Node and all Android source/Git/output paths.
          for path in /usr/local/julia* /usr/share/miniconda /usr/share/az_* /usr/local/aws-cli /usr/local/aws-sam-cli /opt/microsoft/powershell /usr/share/gradle-* /usr/share/sbt /usr/share/kotlinc; do
            if [ -e "$path" ]; then
              sudo du -sx -B1 -- "$path"
              sudo rm -rf -- "$path"
            fi
          done
          /usr/bin/python3 --version
          command -v python3 git gzip tar
          df -B1 .
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends repo python2 git-lfs ccache bc bison flex gperf libncurses5 libxml2-utils xsltproc zip unzip rsync gcc-multilib g++-multilib libssl-dev liblz4-tool e2fsprogs
          git config --global user.name mates-source-probe
          git config --global user.email mates-source-probe@users.noreply.github.com
      - name: Restore the single bounded public compiler cache
        id: compiler-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: out/ccache
          key: mates-q-carrera-public-ccache-v1
      - name: Build and verify the public Carrera system and ramdisk
        run: |
          # This deliberate warm attempt must not silently become another cold build.
          test '${{ steps.compiler-cache.outputs.cache-hit }}' = true
          # Require measured headroom with the cache restored and packages installed.
          free=$(df -B1 --output=avail . | tail -n 1)
          echo "free_bytes_after_setup_and_cache=$free"
          test "$free" -ge 128000000000
          ccache --max-size 3G
          mkdir -p out/android-graph-cache-info
          ccache --zero-stats
          ccache --version > out/android-graph-cache-info/environment.log
          ccache --show-config >> out/android-graph-cache-info/environment.log
          # Immutable warm cache: do not evict useful entries while compiling misses.
          if [ '${{ steps.compiler-cache.outputs.cache-hit }}' = true ]; then
            export CCACHE_READONLY=true
          fi
          python3 scripts/android_carrera_system_probe.py
      - name: Check free cache allowance after an incomplete build
        if: failure() && steps.compiler-cache.outputs.cache-hit != 'true'
        id: cache-budget
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ccache --show-stats
          test -d out/ccache
          bytes=$(du -sb out/ccache | cut -f1)
          test "$bytes" -le 3300000000
          used=$(gh api "repos/$GH_REPO/actions/cache/usage" --jq .active_caches_size_in_bytes)
          test "$used" -le 6000000000
          echo 'save=true' >> "$GITHUB_OUTPUT"
      - name: Preserve compiler work even when the bounded build stops
        if: failure() && steps.cache-budget.outputs.save == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: out/ccache
          key: mates-q-carrera-public-ccache-v1
      - name: Retain diagnostics in logs only
        if: always()
        run: |
          for report in report carrera-report carrera-system-report; do
            if [ -f "out/android-graph/$report.json" ]; then
              cat "out/android-graph/$report.json"
              cat "out/android-graph/$report.json" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ -d out/ccache ]; then ccache --show-stats; fi
          df -B1 .
          for path in out/android-graph/source/.repo out/android-graph/source/out out/android-graph/carrera-system-assets; do
            if [ -d "$path" ]; then du -sx -B1 -- "$path"; fi
          done
          # Measure remaining preinstalled payloads if the disk guard stops again.
          sudo du -x -B1 --max-depth=2 /opt /usr/local /usr/share /usr/lib/jvm 2>/dev/null | sort -nr | head -n 40 || true
          for phase in init sync graph webview-lfs-arm webview-lfs-arm64 carrera carrera-system; do
            if [ -f "out/android-graph/$phase.log" ]; then tail -n 80 "out/android-graph/$phase.log"; fi
          done
      - name: Publish bounded public diagnostics outside Actions artifact storage
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -d out/android-graph ]; then
            if [ -f out/android-graph-cache-info/environment.log ]; then cp out/android-graph-cache-info/environment.log out/android-graph/ccache-environment.log; fi
            python3 scripts/android_build_diagnostics.py
          fi
      - name: Retain the public Carrera development pair
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY_VISIBILITY" = public
          assets=out/android-graph/carrera-system-assets
          test -f "$assets/carrera-public-system.img.gz"
          tag="carrera-public-system-$GITHUB_RUN_ID"
          gh release create "$tag" "$assets"/* --target "$(git rev-parse HEAD)" --prerelease --title "Carrera public Q development pair $GITHUB_RUN_ID — DO NOT FLASH" --notes-file "$assets/README.txt"
