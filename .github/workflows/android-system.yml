name: Mate S public Android Q system image
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Mate S real Android Q graphics modules"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: mates-android-system
  cancel-in-progress: true
jobs:
  graph:
    if: >-
      github.event.repository.private == false &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-22.04
    timeout-minutes: 230
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Prepare disposable runner for public Android sources
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends repo python2 git-lfs bc bison flex gperf libncurses5 libxml2-utils xsltproc zip unzip rsync gcc-multilib g++-multilib libssl-dev liblz4-tool
          git config --global user.name mates-source-probe
          git config --global user.email mates-source-probe@users.noreply.github.com
      - name: Build verified public modules then generic system image
        run: python3 scripts/android_system_probe.py
      - name: Retain diagnostics in logs only
        if: always()
        run: |
          if [ -f out/android-graph/report.json ]; then
            cat out/android-graph/report.json
            cat out/android-graph/report.json >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f out/android-graph/modules-report.json ]; then
            cat out/android-graph/modules-report.json
            cat out/android-graph/modules-report.json >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f out/android-graph/system-report.json ]; then
            cat out/android-graph/system-report.json
            cat out/android-graph/system-report.json >> "$GITHUB_STEP_SUMMARY"
          fi
          for phase in init sync graph modules system; do
            if [ -f "out/android-graph/$phase.log" ]; then tail -n 80 "out/android-graph/$phase.log"; fi
          done
          if [ -f out/android-graph/resolved-manifest.xml ]; then cat out/android-graph/resolved-manifest.xml; fi
      - name: Preserve only the generic public build base as a prerelease
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY_VISIBILITY" = public
          assets=out/android-graph/public-base-assets
          test -f "$assets/generic-q-system.img.gz"
          tag="public-q-base-$GITHUB_RUN_ID"
          gh release create "$tag" "$assets"/* --target "$(git rev-parse HEAD)" --prerelease --title "Generic Android Q development base $GITHUB_RUN_ID — DO NOT FLASH" --notes-file "$assets/PUBLIC-BASE-README.txt"
