name: Carrera G1 first-stage source fixture
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/android-g1-first-stage.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: carrera-g1-first-stage
  cancel-in-progress: false
jobs:
  validate:
    if: github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install small host fixture and ext4 test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ e2fsprogs android-sdk-libsparse-utils
      - name: Verify source checksums before experiment
        run: |
          python3 -m py_compile scripts/g1_first_stage_probe.py
          sha256sum -c SHA256SUMS
      - name: Execute pinned Q source fixture, validate product change and publish guarded evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/g1_first_stage_probe.py
