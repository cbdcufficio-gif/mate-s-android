name: Carrera G1 effective kernel config and policy
on:
  workflow_dispatch:
    inputs:
      bootstrap_tag:
        description: Verified public bootstrap evidence release
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: carrera-g1-contracts
  cancel-in-progress: false
jobs:
  config:
    if: github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      BOOTSTRAP_TAG: ${{ inputs.bootstrap_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install configuration and policy inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ bc bison flex libncurses5-dev libssl-dev setools e2fsprogs android-sdk-libsparse-utils
      - name: Verify checksums and generate config without Image compilation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c SHA256SUMS
          python3 scripts/g1_kernel_policy_probe.py --bootstrap-tag "$BOOTSTRAP_TAG"
