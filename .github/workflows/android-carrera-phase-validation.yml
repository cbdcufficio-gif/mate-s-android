name: Carrera ext4 layout validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-carrera-phase-validation.yml'
      - 'tests/test_carrera_system_phases.py'
      - 'tests/test_carrera_system_layout.py'
permissions:
  contents: read
  actions: write
concurrency:
  group: carrera-image-phase-validation
  cancel-in-progress: false
jobs:
  validate:
    if: github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test phase ordering, shared budget, cache guards and full suite
        run: |
          command -v mke2fs debugfs
          python3 -m unittest discover -s tests -p test_carrera_system_layout.py -v
          python3 -m unittest discover -s tests -p test_carrera_system_phases.py -v
          python3 -m unittest discover tests
          sha256sum -c SHA256SUMS
      - name: Verify dependency target against pinned Q build source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, subprocess
          lock=pathlib.Path('configs/android-resolved-manifest.xml').read_bytes()
          assert hashlib.sha256(lock).hexdigest()=='b30f6d479b321cab00305b1c9a31450d0a8940138996e7e25cf27f7a0146f845'
          result=json.loads(subprocess.check_output(['gh','api','repos/LineageOS/android_build/contents/core/Makefile?ref=71a47798ac090b81c6b7db0b5c470f1fa3e604cd'],text=True))
          data=base64.b64decode(result['content'])
          assert hashlib.sha256(data).hexdigest()=='3579ea7fc8b120fd9ce25f6a0f1ce78b88822d3823250e9adf32825d04ee655e'
          text=data.decode()
          assert '$(INSTALLED_FILES_FILE): $(FULL_SYSTEMIMAGE_DEPS) $(FILESLIST)' in text
          assert 'installed-file-list: $(INSTALLED_FILES_FILE)' in text
          assert '$(BUILT_SYSTEMIMAGE): $(FULL_SYSTEMIMAGE_DEPS) $(INSTALLED_FILES_FILE) $(BUILD_IMAGE_SRCS)' in text
          assert 'TARGET_NO_KERNEL := true' in pathlib.Path('device/huawei/carrera/BoardConfig.mk').read_text()
          print('PINNED_Q_INSTALLED_DEPENDENCIES_CONTRACT_VERIFIED')
          PY
      - name: Execute pinned Q staging function on public fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import ast, base64, hashlib, json, os, pathlib, shutil, subprocess, tempfile
          from types import SimpleNamespace
          result=json.loads(subprocess.check_output(['gh','api','repos/LineageOS/android_build/contents/tools/releasetools/build_image.py?ref=71a47798ac090b81c6b7db0b5c470f1fa3e604cd'],text=True))
          data=base64.b64decode(result['content'])
          assert hashlib.sha256(data).hexdigest()=='1fccbca74e1afe75e317e1c5a99213aaa8934d497b6409f9791039275a1cef0f'
          tree=ast.parse(data.decode())
          function=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='SetUpInDirAndFsConfig')
          with tempfile.TemporaryDirectory() as directory:
              base=pathlib.Path(directory)
              origin=base/'input'
              (origin/'lib').mkdir(parents=True)
              (origin/'lib/libpublic.so').write_bytes(b'public fixture')
              context={'os':os,'shutil':shutil,'common':SimpleNamespace(MakeTempDir=lambda:tempfile.mkdtemp(dir=base))}
              exec(compile(ast.Module(body=[function],type_ignores=[]),'<pinned Q staging>','exec'),context)
              props={'mount_point':'system','system_root_image':'false'}
              staged,config=context['SetUpInDirAndFsConfig'](str(origin),props)
              assert (pathlib.Path(staged)/'system/lib/libpublic.so').read_bytes()==b'public fixture'
              assert not (pathlib.Path(staged)/'lib').exists()
              assert props['mount_point']=='/'
              print('PINNED_Q_NESTED_SYSTEM_STAGING_REPRODUCED_ON_FIXTURE')
              print('This fixture proves builder layout, not hardware mount compatibility')
          PY
      - name: Dispatch at most one deliberate system successor after validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          sha=os.environ['GITHUB_SHA']
          def api(path):
              return json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/'+path],text=True))
          head=api('git/ref/heads/main')['object']['sha']
          if head!=sha:
              print('NO_DISPATCH: main changed; coordinator must inspect new writer')
              raise SystemExit(0)
          runs=api('actions/workflows/android-carrera-system.yml/runs?per_page=100')['workflow_runs']
          if any(r['status']!='completed' for r in runs):
              print('NO_DISPATCH: a system run is active')
              raise SystemExit(0)
          if any(r['head_sha']==sha for r in runs):
              print('NO_DISPATCH: this source already has a system attempt')
              raise SystemExit(0)
          review=api('actions/runs/40630929577')
          assert review['status']=='completed' and review['conclusion']=='success'
          assert review['head_sha']=='4ffa5863df53b6191fcbdf5185a5c728a3d55fa1'
          old=api('actions/runs/40621277229')
          assert old['status']=='completed' and old['conclusion']=='failure'
          assert old['head_sha']=='8f3a4886b54a2ac1fbff66621546e54739b82493'
          subprocess.run(['gh','api','--method','POST',
                          'repos/'+repo+'/actions/workflows/android-carrera-system.yml/dispatches',
                          '-f','ref=main'],check=True)
          print('SINGLE_LAYOUT_VERIFIER_SUCCESSOR_DISPATCHED source='+sha)
          PY
