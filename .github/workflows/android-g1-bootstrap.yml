name: Carrera G1 cache bootstrap and USB contracts
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect immutable G0 or validate already captured small evidence
        type: choice
        options: [inspect-g0, verify-captured]
        default: inspect-g0
permissions:
  contents: write
  actions: read
concurrency:
  group: carrera-g1-contracts
  cancel-in-progress: false
jobs:
  contracts:
    if: github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      REVIEW_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install small inspection and fixture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ make e2fsprogs android-sdk-libsparse-utils binutils setools
      - name: Inspect immutable G0 and execute pinned host fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$REVIEW_MODE" in
            inspect-g0) python3 scripts/g1_bootstrap_probe.py ;;
            verify-captured) python3 scripts/g1_captured_review.py ;;
            *) exit 1 ;;
          esac
