name: Mate S platform libcxx headers
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/platform_cxx_probe.py
      - scripts/header_layout.py
      - .github/workflows/platform-cxx.yml
permissions:
  contents: read
jobs:
  compile:
    if: github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 scripts/platform_cxx_probe.py
      - if: always()
        run: |
          if [ -f out/platform-layout/report.json ]; then
            cat out/platform-layout/report.json
          fi
